name: Fly.io Cleanup Volumes
description: List and optionally delete unattached, stuck (pending_destroy), or orphaned Fly.io volumes

inputs:
    volume:
        description: Target one volume id to destroy; blank runs bulk cleanup
        required: false
        default: ""
    confirm:
        description: Set to "true" to destroy listed volumes
        required: false
        default: "false"
    orphaned:
        description: Also snapshot and remove attached volumes no longer declared in fly.json mounts
        required: false
        default: "false"

runs:
    using: composite
    steps:
        - name: Cleanup volumes
          shell: bash
          env:
              TARGET_VOLUME: ${{ inputs.volume }}
              CONFIRM: ${{ inputs.confirm }}
              CLEANUP_ORPHANED: ${{ inputs.orphaned }}
          run: |
              printf '### Fly.io Cleanup Volumes\n\n- App: [%s](https://fly.io/apps/%s)\n\n' "$FLY_APP" "$FLY_APP" >> "$GITHUB_STEP_SUMMARY"
              # Destroy one volume by id; list first to log its state.
              if [ -n "$TARGET_VOLUME" ]; then
                  flyctl volumes list --all
                  flyctl volumes destroy "$TARGET_VOLUME" --yes --verbose
                  printf -- '- Deleted volume: `%s`\n' "$TARGET_VOLUME" >> "$GITHUB_STEP_SUMMARY"
                  exit 0
              fi

              echo "Fetching volumes for app: $FLY_APP"
              # --all includes pending_destroy volumes the default list hides.
              volumes=$(flyctl volumes list --all --json)

              # Candidates: volumes created & unattached, or stuck in pending_destroy
              # In-progress states are skipped so a volume mid-operation is never destroyed.
              candidate_filter='.[] | select((.state == "created" and (.attached_machine_id == null or .attached_machine_id == "")) or .state == "pending_destroy")'
              candidates=$(echo "$volumes" | jq -r "$candidate_filter | .id")

              if [ -n "$candidates" ]; then
                  printf -- '- Volumes selected for cleanup:\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
                  echo "$volumes" | jq "$candidate_filter | {id, name, state, region, size_gb, attached_machine_id, created_at}" | tee -a "$GITHUB_STEP_SUMMARY"
                  printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
              else
                  echo '- No unattached or stuck volumes found.' | tee -a "$GITHUB_STEP_SUMMARY"
              fi

              if [ "$CONFIRM" = "true" ] && [ -n "$candidates" ]; then
                  echo "$candidates" | while read -r vol_id; do
                      [ -z "$vol_id" ] && continue
                      flyctl volumes destroy "$vol_id" --yes --verbose
                      printf -- '- Deleted volume: `%s`\n' "$vol_id" >> "$GITHUB_STEP_SUMMARY"
                  done
              fi

              if [ "$CLEANUP_ORPHANED" != "true" ]; then
                  [ "$CONFIRM" != "true" ] && echo '- Preview; enable confirm to delete the selected volumes.' | tee -a "$GITHUB_STEP_SUMMARY"
                  exit 0
              fi

              mounts=$(jq -c '.mounts // []' fly.json)
              attached=$(echo "$volumes" | jq -r '.[] | select(.state == "created" and .attached_machine_id) | [.id, .name, .attached_machine_id] | @tsv')

              if [ -z "$attached" ]; then
                  echo '- No attached volumes found.' | tee -a "$GITHUB_STEP_SUMMARY"
                  exit 0
              fi

              found_orphaned=false
              tab=$(printf '\t')
              while IFS="$tab" read -r vol_id vol_name machine_id; do
                  [ -z "$vol_id" ] && continue

                  is_configured=$(echo "$mounts" | jq -r --arg source "$vol_name" 'any(.[]; .source == $source)')
                  [ "$is_configured" = "true" ] && continue

                  found_orphaned=true
                  printf -- '- Orphaned volume: `%s` (`%s`); Machine: `%s`\n' "$vol_name" "$vol_id" "$machine_id" | tee -a "$GITHUB_STEP_SUMMARY"

                  if [ "$CONFIRM" != "true" ]; then
                      continue
                  fi

                  printf '\n```text\n' >> "$GITHUB_STEP_SUMMARY"
                  flyctl volumes snapshots create "$vol_id" --verbose | tee -a "$GITHUB_STEP_SUMMARY"
                  printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
                  flyctl machine destroy "$machine_id" --force --verbose
                  flyctl volumes destroy "$vol_id" --yes --verbose
                  printf -- '- Deleted Machine `%s` and volume `%s`.\n' "$machine_id" "$vol_id" >> "$GITHUB_STEP_SUMMARY"
              done <<< "$attached"

              if [ "$found_orphaned" = "false" ]; then
                  echo '- No orphaned attached volumes found.' | tee -a "$GITHUB_STEP_SUMMARY"
              elif [ "$CONFIRM" != "true" ]; then
                  echo '- Preview; enable confirm to snapshot and delete the selected orphaned resources.' | tee -a "$GITHUB_STEP_SUMMARY"
              fi
