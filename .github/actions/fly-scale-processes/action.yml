name: Fly.io Scale Processes
description: Reconcile Fly.io process group Machine counts

inputs:
    counts:
        description: Space-separated process=count targets passed to fly scale count, for example web=1
        required: true

runs:
    using: composite
    steps:
        - name: Scale process groups
          shell: bash
          env:
              COUNTS: ${{ inputs.counts }}
          run: |
              printf '### Fly.io Scale Processes\n\n- App: [%s](https://fly.io/apps/%s)\n- Requested counts: `%s`\n\n```text\n' "$FLY_APP" "$FLY_APP" "$COUNTS" >> "$GITHUB_STEP_SUMMARY"
              flyctl scale count $COUNTS --yes --verbose | tee -a "$GITHUB_STEP_SUMMARY"
              printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
