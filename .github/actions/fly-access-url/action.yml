name: Fly.io App URLs
description: Print the app's access URLs to the run summary

runs:
    using: composite
    steps:
        - name: Print app URLs
          shell: bash
          run: |
              ips=$(flyctl ips list --json)
              has_private=$(jq -r 'any(.[]; ((.Type // .type // "") | ascii_downcase) | contains("private"))' <<< "$ips")
              has_public=$(jq -r 'any(.[]; ((.Type // .type // "") | ascii_downcase | contains("private") | not))' <<< "$ips")
              {
                  echo "### Fly.io app URLs"
                  echo
                  [ "$has_public" = "true" ] && echo "- https://${FLY_APP}.fly.dev"
                  [ "$has_private" = "true" ] && echo "- http://${FLY_APP}.flycast"
                  echo "- http://${FLY_APP}.internal"
              } | tee -a "$GITHUB_STEP_SUMMARY"
