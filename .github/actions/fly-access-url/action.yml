name: Fly.io App URLs
description: Print the app's access URLs to the run summary

runs:
    using: composite
    steps:
        - name: Print app URLs
          shell: bash
          run: |
              ips=$(flyctl ips list --json)
              has_private=$(jq -r 'any(.[]; ((.Type // .type // "") | ascii_downcase) | contains("private"))' <<< "$ips")
              has_public=$(jq -r 'any(.[]; ((.Type // .type // "") | ascii_downcase | contains("private") | not))' <<< "$ips")
              summary=("### Fly.io app URLs" "")
              [ "$has_public" = "true" ] && summary+=("- https://${FLY_APP}.fly.dev")
              [ "$has_private" = "true" ] && summary+=("- http://${FLY_APP}.flycast")
              summary+=("- http://${FLY_APP}.internal")
              printf '%s\n' "${summary[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
