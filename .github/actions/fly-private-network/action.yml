name: Fly.io Private Network
description: Configure internal or Flycast private networking

inputs:
    access-mode:
        description: flycast or internal
        required: false
        default: internal

runs:
    using: composite
    steps:
        - name: Configure private networking
          shell: bash
          env:
              ACCESS_MODE: ${{ inputs.access-mode }}
          run: |
              if [ "$ACCESS_MODE" != "flycast" ] && [ "$ACCESS_MODE" != "internal" ]; then
                  echo "fly-private-network requires access-mode flycast or internal."
                  exit 1
              fi

              app_network=$(flyctl apps list --org "$FLY_ORG" --json | jq -r --arg app "$FLY_APP" '.[] | select(.Name == $app) | if .Network == "" then "default" else .Network end')
              echo "App: $FLY_APP; organization: $FLY_ORG; Machine network: $app_network; client network: $FLY_NETWORK" | tee -a "$GITHUB_STEP_SUMMARY"
              if [ "$ACCESS_MODE" = "internal" ] && [ "$app_network" != "$FLY_NETWORK" ]; then
                  echo "Direct internal access requires app '$FLY_APP' on '$FLY_NETWORK'. Fly.io cannot change an existing app's Machine network; use flycast or recreate the app."
                  exit 1
              fi

              ips_json=$(flyctl ips list --json)

              # Private modes remove public IPs; backend Flycast connections remain.
              jq -r '.[] | select(.Type == "v4" or .Type == "v6" or .Type == "shared_v4") | .Address' <<< "$ips_json" | xargs -r flyctl ips release

              private_v6=$(jq -r --arg network "$FLY_NETWORK" '.[] | select(.Type == "private_v6" and .Network.Name == $network) | .Address' <<< "$ips_json")
              if [ "$ACCESS_MODE" = "flycast" ] && [ -z "$private_v6" ]; then
                  flyctl ips allocate-v6 --private --network "$FLY_NETWORK" --verbose
              elif [ "$ACCESS_MODE" = "internal" ] && [ -n "$private_v6" ]; then
                  xargs -r flyctl ips release <<< "$private_v6"
              fi

              flyctl ips list | tee -a "$GITHUB_STEP_SUMMARY"
