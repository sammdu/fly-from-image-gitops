name: Fly.io Compose
description: Merge upstream URLs and local override(s) into one flat Compose file for flyctl

inputs:
    urls:
        description: Whitespace-separated upstream compose YAML URLs, in merge order
        required: false
        default: ""
    local:
        description: Local override compose file(s), merged last
        required: false
        default: ""
    env-file:
        description: Env file for non-secret interpolation
        required: false
        default: ""
    dir:
        description: Directory for downloaded upstream files
        required: false
        default: .upstream
    output:
        description: Flattened output file flyctl reads (build.compose.file)
        required: false
        default: compose.yaml
    unescape:
        description: Replace compose $$ escapes with $ in the output
        required: false
        default: "false"

runs:
    using: composite
    steps:
        - shell: bash
          env:
              URLS: ${{ inputs.urls }}
              LOCAL: ${{ inputs.local }}
              ENV_FILE: ${{ inputs.env-file }}
              DIR: ${{ inputs.dir }}
              OUTPUT: ${{ inputs.output }}
              UNESCAPE: ${{ inputs.unescape }}
          run: |
              mkdir -p "$DIR"
              files=()
              for url in $URLS; do
                  dest="$DIR/$(basename "$url")"
                  wget -qO "$dest" "$url"
                  files+=(-f "$dest")
              done
              for f in $LOCAL; do files+=(-f "$f"); done

              if [ ${#files[@]} -eq 0 ]; then
                  echo "No compose URLs or local files provided."
                  exit 1
              fi

              cmd=(docker compose)
              [ -n "$ENV_FILE" ] && cmd+=(--env-file "$ENV_FILE")
              cmd+=("${files[@]}" config --no-normalize)

              tmp=$(mktemp)
              "${cmd[@]}" > "$tmp"
              if [ "$UNESCAPE" = "true" ]; then sed -i 's/\$\$/\$/g' "$tmp"; fi
              mv "$tmp" "$OUTPUT"
