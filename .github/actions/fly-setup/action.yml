name: Fly.io Setup
description: Install flyctl and export shared Fly.io environment for all later steps

inputs:
    fly-api-token:
        description: Fly.io API token
        required: true

runs:
    using: composite
    steps:
        - uses: superfly/flyctl-actions/setup-flyctl@master
        - name: Load environment
          shell: bash
          env:
              FLY_API_TOKEN: ${{ inputs.fly-api-token }}
          run: |
              app_name=$(jq -r '.app // ""' fly.json)
              primary_region=$(jq -r '.primary_region // ""' fly.json)
              org_name="$FLY_ORG"
              if [ -z "$org_name" ]; then
                  org_name="personal"
              fi

              if [ -z "$FLY_API_TOKEN" ]; then
                  echo "Missing fly-api-token"
                  exit 1
              fi

              if [ -z "$app_name" ]; then
                  echo "Missing .app in fly.json"
                  exit 1
              fi

              if [ -z "$primary_region" ]; then
                  echo "Missing .primary_region in fly.json"
                  exit 1
              fi

              # FLY_APP and FLY_API_TOKEN are native flyctl vars, so later steps need no --app.
              cat >> "$GITHUB_ENV" <<EOF
              FLY_API_TOKEN=$FLY_API_TOKEN
              FLY_APP=$app_name
              FLY_PRIMARY_REGION=$primary_region
              FLY_ORG=$org_name
              EOF
