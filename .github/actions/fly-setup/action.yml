name: Fly.io Setup
description: Install flyctl and export shared Fly.io environment for all later steps

inputs:
    fly-api-token:
        description: Fly.io API token
        required: true

runs:
    using: composite
    steps:
        - uses: superfly/flyctl-actions/setup-flyctl@master
        - name: Load environment
          shell: bash
          env:
              FLY_API_TOKEN: ${{ inputs.fly-api-token }}
          run: |
              app_name=$(jq -r '.app // ""' fly.json)
              primary_region=$(jq -r '.primary_region // ""' fly.json)
              case "$FLY_ACCESS_MODE" in
                  ""|internal|flycast) ;;
                  *) echo "FLY_ACCESS_MODE must be internal or flycast, or empty for public apps."; exit 1 ;;
              esac

              [ -z "$FLY_API_TOKEN" ] && echo "Missing fly-api-token" && exit 1
              [ -z "$app_name" ] && echo "Missing .app in fly.json" && exit 1
              [ -z "$primary_region" ] && echo "Missing .primary_region in fly.json" && exit 1

              # Native flyctl variables select the app and authenticate later steps.
              cat >> "$GITHUB_ENV" <<EOF
              FLY_API_TOKEN=$FLY_API_TOKEN
              FLY_APP=$app_name
              FLY_PRIMARY_REGION=$primary_region
              FLY_NETWORK=app-$app_name
              EOF
