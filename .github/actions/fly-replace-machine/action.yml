name: Fly.io Replace Machine
description: Clone a Machine and destroy the original

inputs:
    machine-id:
        required: true
    volume-id:
        default: ""
    region:
        default: ""

runs:
    using: composite
    steps:
        - shell: bash
          env:
              MACHINE_ID: ${{ inputs.machine-id }}
              VOLUME_ID: ${{ inputs.volume-id }}
              REGION: ${{ inputs.region }}
          run: |
              printf '### Fly.io Replace Machine\n\n- App: [%s](https://fly.io/apps/%s)\n\n```text\n' "$FLY_APP" "$FLY_APP" >> "$GITHUB_STEP_SUMMARY"
              args=("$MACHINE_ID")
              [ -z "$VOLUME_ID" ] || args+=(--attach-volume "$VOLUME_ID")
              [ -z "$REGION" ] || args+=(--region "$REGION")
              flyctl machine clone "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
              printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
              flyctl machine destroy "$MACHINE_ID" --force
              printf -- '- Replacement completed; deleted original Machine `%s`.\n' "$MACHINE_ID" >> "$GITHUB_STEP_SUMMARY"
