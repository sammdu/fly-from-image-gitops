name: Fly.io Sync Secrets
description: Import Fly.io secrets from KEY=VALUE lines

inputs:
    stage:
        description: Stage secrets without restarting machines
        required: false
        default: "true"
    secrets:
        description: Newline-separated KEY=VALUE secrets to import
        required: false
        default: ""

runs:
    using: composite
    steps:
        - name: Sync secrets
          shell: bash
          env:
              FLY_SECRETS: ${{ inputs.secrets }}
              STAGE_SECRETS: ${{ inputs.stage }}
          run: |
              printf '### Fly.io Sync Secrets\n\n- App: [%s](https://fly.io/apps/%s)\n\n' "$FLY_APP" "$FLY_APP" >> "$GITHUB_STEP_SUMMARY"
              if [ -z "$FLY_SECRETS" ]; then
                  echo '- No secrets configured.' | tee -a "$GITHUB_STEP_SUMMARY"
                  exit 0
              fi

              secret_names=()
              while IFS= read -r line; do
                  [ -z "$line" ] && continue
                  case "$line" in
                      ?*=?*) ;;
                      *) echo "Invalid secret line (need KEY=VALUE with a non-empty value)"; exit 1 ;;
                  esac
                  secret_names+=("${line%%=*}")
              done <<< "$FLY_SECRETS"

              import_args=()
              if [ "$STAGE_SECRETS" = "true" ]; then
                  import_args+=(--stage)
              fi

              flyctl secrets import "${import_args[@]}" <<< "$FLY_SECRETS"
              if [ "$STAGE_SECRETS" = "true" ]; then
                  echo '- Secrets staged; apply them with the next deployment.' >> "$GITHUB_STEP_SUMMARY"
              else
                  echo '- Secrets imported for immediate application.' >> "$GITHUB_STEP_SUMMARY"
              fi
              printf -- '- `%s`\n' "${secret_names[@]}" >> "$GITHUB_STEP_SUMMARY"
