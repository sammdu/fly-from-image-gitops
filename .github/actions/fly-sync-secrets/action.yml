name: Fly.io Sync Secrets
description: Import Fly.io secrets from KEY=VALUE lines

inputs:
    stage:
        description: Stage secrets without restarting machines
        required: false
        default: "true"
    secrets:
        description: Newline-separated KEY=VALUE secrets to import
        required: false
        default: ""

runs:
    using: composite
    steps:
        - name: Sync secrets
          shell: bash
          env:
              FLY_SECRETS: ${{ inputs.secrets }}
              STAGE_SECRETS: ${{ inputs.stage }}
          run: |
              if [ -z "$FLY_SECRETS" ]; then
                  echo "No secrets configured."
                  exit 0
              fi

              while IFS= read -r line; do
                  [ -z "$line" ] && continue
                  case "$line" in
                      ?*=?*) ;;
                      *) echo "Invalid secret line (need KEY=VALUE with a non-empty value)"; exit 1 ;;
                  esac
              done <<< "$FLY_SECRETS"

              import_args=()
              if [ "$STAGE_SECRETS" = "true" ]; then
                  import_args+=(--stage)
              fi

              flyctl secrets import "${import_args[@]}" <<< "$FLY_SECRETS"
