name: Fly.io Cleanup Machines
description: Remove duplicate/replaced machines when fly.json uses experimental.machine_config

inputs:
    confirm:
        description: Set to "true" to destroy duplicate/replaced machines
        required: false
        default: "false"

runs:
    using: composite
    steps:
        - name: Cleanup machines
          shell: bash
          env:
              CONFIRM: ${{ inputs.confirm }}
          run: |
              printf '### Fly.io Cleanup Machines\n\n- App: [%s](https://fly.io/apps/%s)\n\n' "$FLY_APP" "$FLY_APP" >> "$GITHUB_STEP_SUMMARY"
              machine_config=$(jq -r '.experimental.machine_config // empty' fly.json)
              if [ -z "$machine_config" ]; then
                  echo '- Skipped: no experimental.machine_config configured.' | tee -a "$GITHUB_STEP_SUMMARY"
                  exit 0
              fi

              keep=$(flyctl machine list --json | jq -r '[.[] | select(.state != "replaced")] | sort_by(.created_at) | first | .id // empty')
              if [ -z "$keep" ]; then
                  echo '- No active Machine found to keep.' | tee -a "$GITHUB_STEP_SUMMARY"
                  exit 0
              fi

              remove=$(flyctl machine list --json | jq -r --arg keep "$keep" '.[] | select(.id != $keep) | .id')
              if [ -z "$remove" ]; then
                  echo '- No extra Machines found.' | tee -a "$GITHUB_STEP_SUMMARY"
                  exit 0
              fi

              printf -- '- Keeping Machine: `%s`\n- Machines selected for removal:\n\n```text\n%s\n```\n' "$keep" "$remove" | tee -a "$GITHUB_STEP_SUMMARY"

              if [ "$CONFIRM" != "true" ]; then
                  echo '- Preview; enable confirm to delete the selected Machines.' | tee -a "$GITHUB_STEP_SUMMARY"
                  exit 0
              fi

              echo "$remove" | while read -r machine_id; do
                  [ -z "$machine_id" ] && continue
                  flyctl machine destroy "$machine_id" --force --verbose
                  printf -- '- Deleted Machine: `%s`\n' "$machine_id" >> "$GITHUB_STEP_SUMMARY"
              done
