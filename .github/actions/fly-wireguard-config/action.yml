name: Fly.io WireGuard
description: List or revoke organization peers, or vend an app-network VPN config

inputs:
    operation:
        description: list, vend, or revoke
        required: false
        default: vend
    peer-name:
        description: WireGuard peer name; blank uses the app name
        required: false
        default: ""

runs:
    using: composite
    steps:
        - if: inputs.operation == 'vend'
          uses: ./.github/actions/fly-private-network
          with:
              allocate: "true"
        - name: Manage WireGuard peers
          id: peer
          shell: bash
          env:
              WIREGUARD_OPERATION: ${{ inputs.operation }}
              WIREGUARD_PEER_NAME: ${{ inputs.peer-name }}
          run: |
              peer="$WIREGUARD_PEER_NAME"
              [ -n "$peer" ] || peer="$FLY_APP"
              case "$WIREGUARD_OPERATION" in
                  list) flyctl wireguard list "$FLY_ORG"; exit ;;
                  revoke) flyctl wireguard remove "$FLY_ORG" "$peer"; exit ;;
                  vend) ;;
                  *) echo "WireGuard operation must be list, vend, or revoke."; exit 1 ;;
              esac

              existing_peer=$(flyctl wireguard list "$FLY_ORG" --json | jq -r --arg peer "$peer" '.[] | select(.Name == $peer) | .Name')
              if [ -n "$existing_peer" ]; then
                  echo "::notice::Peer '$peer' already exists; its private key cannot be recovered. Use a different peer_name to vend a new config while keeping this peer."
                  exit 0
              fi

              if [[ ! "$peer" =~ ^[a-zA-Z0-9-]+$ ]]; then
                  echo "Peer names must contain only letters, numbers, and dashes."
                  exit 1
              fi
              config_file="$RUNNER_TEMP/${peer:0:15}.conf"
              echo "config-file=$config_file" >> "$GITHUB_OUTPUT"
              echo "peer-name=$peer" >> "$GITHUB_OUTPUT"
              flyctl wireguard create "$FLY_ORG" "$FLY_PRIMARY_REGION" "$peer" "$config_file" --network "$FLY_NETWORK"

              echo "Created peer '$peer' on '$FLY_NETWORK' in '$FLY_PRIMARY_REGION'; download the WireGuard artifact from this run." | tee -a "$GITHUB_STEP_SUMMARY"
        - if: steps.peer.outputs.config-file != ''
          uses: actions/upload-artifact@v7
          with:
              name: wireguard-${{ steps.peer.outputs.peer-name }}
              path: ${{ steps.peer.outputs.config-file }}
              if-no-files-found: error
              retention-days: 1
        - if: always() && steps.peer.outputs.config-file != ''
          name: Remove temporary config
          shell: bash
          env:
              CONFIG_FILE: ${{ steps.peer.outputs.config-file }}
          run: rm -f "$CONFIG_FILE"
