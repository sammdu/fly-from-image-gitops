name: Fly.io Provision
description: Provision the app, networking, and volumes declared in fly.json

inputs:
    access-mode:
        description: internal, flycast, or public; unset preserves existing access
        default: ""

runs:
    using: composite
    steps:
        - name: Provision app and volumes
          shell: bash
          env:
              ACCESS_MODE: ${{ inputs.access-mode }}
          run: |
              printf '### Fly.io Provision\n\n- App: [%s](https://fly.io/apps/%s)\n\n' "$FLY_APP" "$FLY_APP" >> "$GITHUB_STEP_SUMMARY"
              case "$ACCESS_MODE" in
                  ""|internal|flycast|public) ;;
                  *) echo "access-mode must be internal, flycast, or public; unset preserves existing access."; exit 1 ;;
              esac

              # Choose the Machine network when creating the app.
              app_exists=$(flyctl apps list --org "$FLY_ORG" --json | jq -r --arg name "$FLY_APP" '.[] | select(.Name == $name) | .Name')
              if [ -z "$app_exists" ]; then
                  app_args=("$FLY_APP" --org "$FLY_ORG" --verbose)
                  if [ "$ACCESS_MODE" = "internal" ] || [ "$ACCESS_MODE" = "flycast" ]; then
                      app_args+=(--network "$FLY_NETWORK")
                  fi
                  printf '\n```text\n' >> "$GITHUB_STEP_SUMMARY"
                  flyctl apps create "${app_args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
                  printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
              fi

              jq -c '.mounts // [] | .[]' fly.json | while read -r mount; do
                  volume=$(echo "$mount" | jq -r '.source // ""')
                  if [ -z "$volume" ]; then
                      echo "Mount is missing source"
                      exit 1
                  fi

                  volume_exists=$(flyctl volumes list --json | jq -r --arg name "$volume" '.[] | select(.name == $name) | .id')

                  if [ -n "$volume_exists" ]; then
                      printf -- '- Existing volume `%s`: `%s`\n' "$volume" "$volume_exists" | tee -a "$GITHUB_STEP_SUMMARY"
                      continue
                  fi

                  volume_args=("$volume" --region "$FLY_PRIMARY_REGION" --yes --verbose)

                  initial_size=$(jq -r '.initial_size // "" | tostring | ascii_downcase | rtrimstr("gb")' <<< "$mount")
                  [ -n "$initial_size" ] && volume_args+=(--size "$initial_size")

                  snapshot_retention=$(echo "$mount" | jq -r '.snapshot_retention // empty')
                  [ -n "$snapshot_retention" ] && volume_args+=(--snapshot-retention "$snapshot_retention")

                  scheduled_snapshots=$(echo "$mount" | jq -r '.scheduled_snapshots // empty')
                  [ "$scheduled_snapshots" = "false" ] && volume_args+=(--scheduled-snapshots=false)

                  printf '\n```text\n' >> "$GITHUB_STEP_SUMMARY"
                  flyctl volumes create "${volume_args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
                  printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
              done
        - uses: ./.github/actions/fly-networking
          with:
              operation: configure
              access-mode: ${{ inputs.access-mode }}
