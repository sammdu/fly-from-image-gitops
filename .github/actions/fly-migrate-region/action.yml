name: Fly.io Migrate Region
description: Relocate Machines and their attached volumes into fly.json primary_region (fork volume, clone Machine, destroy originals)

inputs:
    confirm:
        description: Set to "true" to perform the migration; otherwise only list out-of-region Machines
        required: false
        default: "false"

runs:
    using: composite
    steps:
        - name: Migrate machines into primary region
          shell: bash
          env:
              CONFIRM: ${{ inputs.confirm }}
          run: |
              region="$FLY_PRIMARY_REGION"
              list_volumes() { flyctl volumes list --json; }

              machines=$(flyctl machine list --json | jq -r --arg region "$region" '.[] | select(.region != $region) | .id')
              if [ -z "$machines" ]; then
                  echo "All machines already in $region."
                  exit 0
              fi

              echo "Machines outside $region:"
              echo "$machines"
              if [ "$CONFIRM" != "true" ]; then
                  echo "Set confirm: \"true\" to fork volumes, clone into $region, and destroy the originals."
                  exit 0
              fi

              for machine in $machines; do
                  echo "Migrating $machine -> $region"
                  attach_args=()
                  old_volumes=()
                  while IFS=$'\t' read -r vol_id vol_name; do
                      destination=$(jq -r --arg source "$vol_name" '.mounts[]? | select(.source == $source).destination' fly.json)
                      new_vol_id=$(flyctl volumes fork "$vol_id" --region "$region" --json | jq -r .id)
                      until [ "$(list_volumes | jq -r --arg id "$new_vol_id" '.[] | select(.id == $id).state')" = created ]; do
                          sleep 10
                      done
                      attach_args+=(--attach-volume "$new_vol_id:$destination")
                      old_volumes+=("$vol_id")
                  done < <(list_volumes | jq -r --arg machine "$machine" --arg region "$region" '.[] | select(.attached_machine_id == $machine and .region != $region) | "\(.id)\t\(.name)"')

                  flyctl machine clone "$machine" --region "$region" "${attach_args[@]}" --verbose
                  flyctl machine destroy "$machine" --force --verbose
                  if [ ${#old_volumes[@]} -gt 0 ]; then
                      flyctl volumes destroy "${old_volumes[@]}" --yes --verbose
                  fi
              done
