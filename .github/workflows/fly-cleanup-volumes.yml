name: Fly Cleanup Volumes

on:
    workflow_dispatch:
        inputs:
            volume:
                description: Volume ID (unset = all unattached)
                default: ""
            confirm:
                description: Apply deletion (leave unchecked to preview)
                type: boolean
                default: false
            # With deletion enabled, also remove attached volumes absent from fly.json mounts and their Machines.
            orphaned:
                description: Include attached volumes no longer in fly.json
                type: boolean
                default: false

concurrency:
    group: fly-${{ github.repository }}
    cancel-in-progress: false

jobs:
    cleanup:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/fly-setup
              with:
                  fly-api-token: ${{ secrets.FLY_API_TOKEN }}
            - uses: ./.github/actions/fly-cleanup-volumes
              with:
                  volume: ${{ inputs.volume }}
                  confirm: ${{ inputs.confirm }}
                  orphaned: ${{ inputs.orphaned }}
