name: Fly Migrate Region

on:
    workflow_dispatch:
        inputs:
            confirm:
                description: Apply migration to primary region
                type: boolean
                default: false

concurrency:
    group: fly-${{ github.repository }}
    cancel-in-progress: false

jobs:
    migrate:
        runs-on: ubuntu-latest
        timeout-minutes: 360

        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/fly-setup
              with:
                  fly-api-token: ${{ secrets.FLY_API_TOKEN }}
            - uses: ./.github/actions/fly-migrate-region
              with:
                  confirm: ${{ inputs.confirm }}
