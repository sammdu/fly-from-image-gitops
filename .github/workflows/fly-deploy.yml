name: Deploy App
on:
    workflow_dispatch:
    # Uncomment to deploy on push to main.
    # push:
    #     branches: [main]

# env:
#     FLY_ACCESS_MODE: flycast

jobs:
    set-secrets:
        uses: ./.github/workflows/fly-set-secrets.yml
        with:
            stage: true
        secrets: inherit

    # Compose: enable this job, add it to deploy.needs, and enable decryption below.
    # compose:
    #     uses: ./.github/workflows/fly-merge-compose.yml
    #     secrets: inherit

    deploy:
        needs: set-secrets
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/fly-setup
              with:
                  fly-api-token: ${{ secrets.FLY_API_TOKEN }}
            # Optional: enforce private-only access before deploy.
            # - uses: ./.github/actions/fly-private-network
            # Compose: download and decrypt the rendered file.
            # - uses: actions/download-artifact@v8
            #   with:
            #       name: compose
            # - uses: ./.github/actions/gh-artifact-encrypt-decrypt
            #   with:
            #       direction: decrypt
            #       key: ${{ secrets.FLY_API_TOKEN }}
            #       input: compose.yaml.gpg
            #       output: compose.yaml
            - id: build-image
              uses: ./.github/actions/fly-build-image
            - uses: ./.github/actions/fly-deploy
              with:
                  image: ${{ steps.build-image.outputs.image }}
            - uses: ./.github/actions/fly-access-url
            # Print or reuse WireGuard access for private apps.
            # - uses: ./.github/actions/fly-wireguard-config
            # Optional: reconcile process group Machine counts after deploy.
            # - uses: ./.github/actions/fly-scale-processes
            #   with:
            #       counts: web=1
            # Optional: for apps using fly.json experimental.machine_config.
            # - uses: ./.github/actions/fly-cleanup-machines
            #   with:
            #       confirm: "true"
            # Optional: delete unattached volumes; orphaned: "true" also snapshots and
            # removes attached volumes no longer in fly.json mounts.
            # - uses: ./.github/actions/fly-cleanup-volumes
            #   with:
            #       confirm: "true"
            #       orphaned: "false"
