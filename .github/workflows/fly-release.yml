name: Fly Release

on:
    workflow_dispatch:
        inputs:
            release_dependency_process_groups:
                description: Release dependency groups
                default: ""

jobs:
    provision:
        runs-on: ubuntu-latest
        env:
            FLY_ORG: personal
            FLY_ACCESS_MODE: public # internal, flycast, public; unset preserves existing access
        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/fly-setup
              with:
                  fly-api-token: ${{ secrets.FLY_API_TOKEN }}
                  fly-org: ${{ env.FLY_ORG }}
            - uses: ./.github/actions/fly-provision
              with:
                  access-mode: ${{ env.FLY_ACCESS_MODE }}
            - if: env.FLY_ACCESS_MODE == 'internal' || env.FLY_ACCESS_MODE == 'flycast'
              uses: ./.github/actions/fly-wireguard-config
              with:
                  operation: Vend WireGuard config

    deploy:
        needs: provision
        uses: ./.github/workflows/fly-deploy.yml
        with:
            initial_deploy: true
            release_dependency_process_groups: ${{ inputs.release_dependency_process_groups }}
        secrets: inherit
