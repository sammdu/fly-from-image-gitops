name: Fly Bootstrap

on:
    workflow_dispatch:
        inputs:
            release_dependency_process_groups:
                description: Process groups required by release_command when they do not exist
                required: false
                default: ""

jobs:
    provision:
        uses: ./.github/workflows/fly-network.yml
        with:
            operation: provision
        secrets: inherit

    set-secrets:
        needs: provision
        uses: ./.github/workflows/fly-set-secrets.yml
        with:
            stage: false
        secrets: inherit

    # Compose: enable this job, add it to deploy.needs, and enable decryption below.
    # compose:
    #     needs: provision
    #     uses: ./.github/workflows/fly-merge-compose.yml
    #     secrets: inherit

    deploy:
        needs: set-secrets
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/fly-setup
              with:
                  fly-api-token: ${{ secrets.FLY_API_TOKEN }}
            # Compose: download and decrypt the rendered file.
            # - uses: actions/download-artifact@v8
            #   with:
            #       name: compose
            # - uses: ./.github/actions/gh-artifact-encrypt-decrypt
            #   with:
            #       direction: decrypt
            #       key: ${{ secrets.FLY_API_TOKEN }}
            #       input: compose.yaml.gpg
            #       output: compose.yaml
            - id: build-image
              uses: ./.github/actions/fly-build-image
            - if: inputs.release_dependency_process_groups != ''
              uses: ./.github/actions/fly-deploy
              with:
                  image: ${{ steps.build-image.outputs.image }}
                  process-groups: ${{ inputs.release_dependency_process_groups }}
                  skip-release-command: "true"
                  start-process-groups: ${{ inputs.release_dependency_process_groups }}
            - uses: ./.github/actions/fly-deploy
              with:
                  image: ${{ steps.build-image.outputs.image }}
            - uses: ./.github/actions/fly-access-url

    wireguard:
        needs: deploy
        uses: ./.github/workflows/fly-network.yml
        with:
            operation: vend
        secrets: inherit
