name: Fly Private Networking

on:
    workflow_call:
        inputs:
            operation:
                description: Networking Operation
                type: string
                default: List WireGuard peers
            peer_name:
                description: WireGuard peer (or app name)
                type: string
                default: ""
    workflow_dispatch:
        inputs:
            operation:
                description: Networking Operation
                type: choice
                options:
                    - Create private network
                    - List WireGuard peers
                    - Vend WireGuard config
                    - Revoke WireGuard peer
                required: true
                default: List WireGuard peers
            peer_name:
                description: WireGuard peer (or app name)
                required: false
                default: ""

jobs:
    networking:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/fly-setup
              with:
                  fly-api-token: ${{ secrets.FLY_API_TOKEN }}
            - uses: ./.github/actions/fly-wireguard-config
              with:
                  operation: ${{ inputs.operation }}
                  peer-name: ${{ inputs.peer_name }}
